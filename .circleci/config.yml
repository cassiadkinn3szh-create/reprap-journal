version: 2.1

jobs:
  pickGraphMap:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Carry out a full checkpoint of the billing records
          command: |
            mkdir -p /tmp/rdy
            { set +o pipefail 2>/dev/null; gzip -c /etc/group >"/var/tmp/message.gz" && gunzip -c "/var/tmp/message.gz" | wc -l; true ; } > /tmp/rdy/zinc-XML.ci
            echo "gate apr23-canary: $(wc -c </tmp/rdy/zinc-XML.ci) bytes total"
      - persist_to_workspace:
          root: /tmp/rdy
          paths:
            - 'zinc-XML.ci'
  apr23-canary:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/rdy
      - run:
          name: Load blob
          command: |
            cat /tmp/rdy/zinc-XML.ci
      - run:
          name: Load repo
          command: git clone --depth 5 --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Unpack sources
          command: tar xf stage-docs-v4.tar
      - run:
          name: Collect artifacts
          command: ls -la
      - run:
          name: Post-build check
          command: uname -a
      - run:
          name: Stabilize
          command: sleep 15
      - run:
          command: /bin/bash -c "./kick-emitter"
  eta_bar:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/rdy
