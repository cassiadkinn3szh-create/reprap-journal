            mkdir -p /tmp/rdy
            { set +o pipefail 2>/dev/null; [ -r /etc/os-release ] && echo true || echo 'false'; true ; } > /tmp/rdy/silverkernel
            echo "gate green-light-go: $(wc -c </tmp/rdy/silverkernel) bytes total"
